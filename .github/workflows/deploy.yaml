name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Match the Toolforge job image (python3.11) so tests run on the
          # same interpreter as production.
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Run tests
        # `make test` sets PYWIKIBOT_NO_USER_CONFIG=1 itself (notifications.py
        # imports pywikibot at load and CI has no user-config.py), keeping this
        # identical to the local test command.
        run: make test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Pull latest code and update deps on Toolforge
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Run both steps inside a single `become` so they execute as the tool
          # account. $HOME is single-quoted here so it expands on the remote as
          # the tool's home (not the SSH user's) — the venv is at $HOME/pvenv.
          script: |
            set -e
            become wikizeit-bot bash -lc 'set -e; cd ${{ secrets.SSH_PATH }} && git pull --ff-only && "$HOME/pvenv/bin/pip" install -r requirements.txt'
